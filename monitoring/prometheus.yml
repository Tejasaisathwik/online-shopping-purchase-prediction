global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: student_result_api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: online_shopping_api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
