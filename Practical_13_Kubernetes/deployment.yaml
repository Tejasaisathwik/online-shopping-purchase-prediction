apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shopping-prediction
  labels:
    app: online-shopping-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: online-shopping-prediction
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: online-shopping-prediction
    spec:
      containers:
        - name: online-shopping-api
          image: teja211/online-shopping-prediction:practical-12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
