global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/online_shopping_alerts.yml

scrape_configs:
  - job_name: "online-shopping-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "online-shopping-api:8000"
          - "host.docker.internal:8000"

  - job_name: "student-result-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "online-shopping-api:8000"
          - "host.docker.internal:8000"
